<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NKDON Logistics — Track Shipment</title>

  <meta
    name="description"
    content="Track your NKDON Logistics shipment using your tracking number."
  >

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fa;
    }

    .brand {
      letter-spacing: 1px;
    }

    .tracking-line {
      position: relative;
    }

    .tracking-line::before {
      content: "";
      position: absolute;
      left: 10px;
      top: 24px;
      bottom: 0;
      width: 2px;
      background: #d9dee7;
    }

    .event:last-child .tracking-line::before {
      display: none;
    }

    .event-dot {
      position: relative;
      z-index: 2;
    }
  </style>
</head>

<body class="min-h-screen">

  <!-- HEADER -->
  <header class="bg-slate-950 text-white">
    <div class="max-w-6xl mx-auto px-5 py-5 flex items-center justify-between">

      <div>
        <div class="text-2xl font-extrabold brand">
          NKDON
        </div>

        <div class="text-xs text-slate-400 tracking-widest">
          LOGISTICS
        </div>
      </div>

      <a
        href="https://nkdon2231.github.io/nk-don-tracking/"
        class="text-sm text-slate-300 hover:text-white"
      >
        Home
      </a>

    </div>
  </header>


  <!-- HERO -->
  <section class="bg-slate-900 text-white">
    <div class="max-w-5xl mx-auto px-5 py-14 text-center">

      <p class="uppercase text-sm tracking-[4px] text-slate-400 mb-3">
        Shipment Tracking
      </p>

      <h1 class="text-4xl md:text-5xl font-bold mb-5">
        Track Your Shipment
      </h1>

      <p class="text-slate-300 max-w-2xl mx-auto">
        Enter your NKDON tracking number to view the latest shipment status
        and delivery information.
      </p>

    </div>
  </section>


  <!-- TRACKING SEARCH -->
  <main class="max-w-5xl mx-auto px-5 -mt-7 pb-16">

    <div class="bg-white rounded-2xl shadow-xl p-5 md:p-7">

      <div class="flex flex-col md:flex-row gap-3">

        <input
          id="trackingInput"
          type="text"
          placeholder="Enter tracking number"
          autocomplete="off"
          class="flex-1 border border-slate-300 rounded-xl px-5 py-4 text-base outline-none focus:ring-2 focus:ring-slate-800"
        >

        <button
          id="trackButton"
          onclick="trackShipment()"
          class="bg-slate-950 text-white font-semibold rounded-xl px-8 py-4 hover:bg-slate-800 transition"
        >
          Track Shipment
        </button>

      </div>

      <p class="text-xs text-slate-500 mt-3">
        Example: NKD-20260924-4034
      </p>

    </div>


    <!-- RESULT -->
    <div id="result" class="mt-8"></div>

  </main>


  <!-- FOOTER -->
  <footer class="bg-slate-950 text-slate-400">
    <div class="max-w-6xl mx-auto px-5 py-8 text-center text-sm">

      <div class="text-white font-bold text-lg mb-1">
        NKDON LOGISTICS
      </div>

      <p>
        Reliable shipment tracking and delivery services.
      </p>

      <p class="mt-4 text-xs">
        © 2026 NKDON Logistics. All rights reserved.
      </p>

    </div>
  </footer>


<script>

/* =========================================================
   NKDON SUPABASE CONFIGURATION
   ========================================================= */

const SUPABASE_URL =
  "https://cpjbxllhabghsvpsdzrm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_ZmrGlIzkRyR4Kenj9s8HyQ_q-6t8GsW";


/* =========================================================
   TRACK SHIPMENT
   ========================================================= */

async function trackShipment() {

  const input =
    document.getElementById("trackingInput");

  const button =
    document.getElementById("trackButton");

  const result =
    document.getElementById("result");

  const trackingNumber =
    input.value.trim();

  if (!trackingNumber) {

    result.innerHTML = `
      <div class="bg-white border border-red-200 rounded-2xl p-6">
        <div class="text-red-600 font-bold text-lg">
          Tracking Number Required
        </div>

        <p class="text-slate-600 mt-2">
          Please enter your NKDON tracking number.
        </p>
      </div>
    `;

    return;
  }


  button.disabled = true;

  button.innerHTML = "Tracking...";


  result.innerHTML = `
    <div class="bg-white rounded-2xl shadow p-8 text-center">

      <div class="animate-pulse">

        <div class="h-5 bg-slate-200 rounded w-40 mx-auto mb-4"></div>

        <div class="h-4 bg-slate-200 rounded w-64 mx-auto"></div>

      </div>

    </div>
  `;


  try {

    const response = await fetch(
      SUPABASE_URL + "/rest/v1/rpc/track_shipment",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        },

        body: JSON.stringify({
          p_tracking_number: trackingNumber
        })
      }
    );


    const rawText =
      await response.text();


    if (!response.ok) {

      let errorMessage = rawText;

      try {

        const errorJson =
          JSON.parse(rawText);

        errorMessage =
          errorJson.message ||
          errorJson.error_description ||
          errorJson.hint ||
          rawText;

      } catch (e) {}

      throw new Error(
        "HTTP " +
        response.status +
        ": " +
        errorMessage
      );
    }


    let data;

    try {

      data =
        JSON.parse(rawText);

    } catch (e) {

      throw new Error(
        "The tracking server returned an invalid response."
      );
    }


    /*
      Supabase RPC normally returns an array.
    */

    let payload = data;

    if (Array.isArray(payload)) {
      payload = payload[0];
    }


    /*
      Some RPC configurations return the result
      inside a track_shipment property.
    */

    if (
      payload &&
      payload.track_shipment
    ) {
      payload =
        payload.track_shipment;
    }


    /*
      Handle JSON returned as a string.
    */

    if (typeof payload === "string") {

      try {

        payload =
          JSON.parse(payload);

      } catch (e) {}

    }


    if (
      !payload ||
      !payload.shipment
    ) {

      throw new Error(
        "Shipment not found."
      );
    }


    displayShipment(payload);

  } catch (error) {

    console.error(error);

    result.innerHTML = `

      <div class="bg-white border border-red-200 rounded-2xl shadow p-7">

        <div class="flex items-start gap-4">

          <div class="text-3xl">
            ⚠️
          </div>

          <div>

            <h2 class="text-xl font-bold text-red-600">
              Tracking Temporarily Unavailable
            </h2>

            <p class="text-slate-600 mt-2">
              The tracking service could not retrieve the shipment right now.
            </p>

            <div class="mt-4 bg-red-50 border border-red-100 rounded-lg p-3">

              <p class="text-xs text-red-700 break-words">
                ${escapeHtml(error.message)}
              </p>

            </div>

          </div>

        </div>

      </div>
    `;

  } finally {

    button.disabled = false;

    button.innerHTML =
      "Track Shipment";
  }
}


/* =========================================================
   DISPLAY SHIPMENT
   ========================================================= */

function displayShipment(data) {

  const result =
    document.getElementById("result");

  const shipment =
    data.shipment;

  let events =
    data.events || [];


  if (!Array.isArray(events)) {
    events = [];
  }


  events.sort(function(a, b) {

    return new Date(a.event_time) -
           new Date(b.event_time);

  });


  const status =
    shipment.status ||
    "In Transit";


  const trackingNumber =
    shipment.tracking_number ||
    "—";


  const origin =
    shipment.origin ||
    "—";


  const destination =
    shipment.destination ||
    "—";


  const currentLocation =
    shipment.current_location ||
    shipment.destination ||
    "—";


  const estimatedDelivery =
    formatDate(
      shipment.estimated_delivery
    );


  const latestEvent =
    events.length
      ? events[events.length - 1]
      : null;


  result.innerHTML = `

    <!-- SUMMARY -->

    <div class="bg-white rounded-2xl shadow-lg overflow-hidden">

      <div class="bg-slate-950 text-white p-6 md:p-8">

        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-5">

          <div>

            <p class="text-xs uppercase tracking-widest text-slate-400">
              Tracking Number
            </p>

            <h2 class="text-2xl md:text-3xl font-bold mt-1">
              ${escapeHtml(trackingNumber)}
            </h2>

          </div>


          <div class="inline-flex">

            <span class="bg-white text-slate-900 px-5 py-2 rounded-full text-sm font-bold">
              ${escapeHtml(status)}
            </span>

          </div>

        </div>

      </div>


      <!-- ROUTE -->

      <div class="p-6 md:p-8">

        <div class="grid md:grid-cols-3 gap-6">

          <div>

            <p class="text-xs uppercase tracking-widest text-slate-400">
              Origin
            </p>

            <p class="font-semibold text-slate-900 mt-1">
              ${escapeHtml(origin)}
            </p>

          </div>


          <div>

            <p class="text-xs uppercase tracking-widest text-slate-400">
              Current Location
            </p>

            <p class="font-semibold text-slate-900 mt-1">
              ${escapeHtml(currentLocation)}
            </p>

          </div>


          <div>

            <p class="text-xs uppercase tracking-widest text-slate-400">
              Destination
            </p>

            <p class="font-semibold text-slate-900 mt-1">
              ${escapeHtml(destination)}
            </p>

          </div>

        </div>


        <div class="border-t border-slate-200 my-7"></div>


        <div class="grid md:grid-cols-3 gap-6">

          <div>

            <p class="text-xs uppercase tracking-widest text-slate-400">
              Estimated Delivery
            </p>

            <p class="font-semibold text-slate-900 mt-1">
              ${escapeHtml(estimatedDelivery)}
            </p>

          </div>


          <div>

            <p class="text-xs uppercase tracking-widest text-slate-400">
              Shipment Type
            </p>

            <p class="font-semibold text-slate-900 mt-1">
              ${escapeHtml(
                shipment.shipment_type ||
                "Parcel"
              )}
            </p>

          </div>


          <div>

            <p class="text-xs uppercase tracking-widest text-slate-400">
              Last Update
            </p>

            <p class="font-semibold text-slate-900 mt-1">
              ${
                latestEvent
                  ? formatDateTime(latestEvent.event_time)
                  : "—"
              }
            </p>

          </div>

        </div>

      </div>

    </div>


    <!-- TIMELINE -->

    <div class="bg-white rounded-2xl shadow-lg mt-7 p-6 md:p-8">

      <h2 class="text-2xl font-bold text-slate-900 mb-7">
        Shipment Progress
      </h2>

      ${
        events.length
          ? events.map(function(event, index) {

              const isLast =
                index === events.length - 1;

              return `

                <div class="event flex gap-4">

                  <div class="tracking-line flex flex-col items-center">

                    <div
                      class="event-dot w-5 h-5 rounded-full ${
                        isLast
                          ? "bg-slate-950"
                          : "bg-slate-400"
                      }"
                    ></div>

                  </div>


                  <div class="pb-8 flex-1">

                    <div class="flex flex-col md:flex-row md:justify-between gap-1">

                      <h3 class="font-bold text-slate-900">
                        ${escapeHtml(
                          event.status ||
                          "Shipment Update"
                        )}
                      </h3>

                      <span class="text-sm text-slate-500">
                        ${formatDateTime(event.event_time)}
                      </span>

                    </div>


                    ${
                      event.location
                        ? `
                          <p class="text-sm font-semibold text-slate-700 mt-1">
                            ${escapeHtml(event.location)}
                          </p>
                        `
                        : ""
                    }


                    ${
                      event.facility
                        ? `
                          <p class="text-sm text-slate-500 mt-1">
                            Facility: ${escapeHtml(event.facility)}
                          </p>
                        `
                        : ""
                    }


                    ${
                      event.description
                        ? `
                          <p class="text-sm text-slate-600 mt-2 leading-relaxed">
                            ${escapeHtml(event.description)}
                          </p>
                        `
                        : ""
                    }

                  </div>

                </div>

              `;

            }).join("")

          : `

            <div class="text-center py-8 text-slate-500">
              No tracking events are currently available.
            </div>

          `
      }

    </div>


    <!-- SUPPORT -->

    <div class="mt-7 text-center text-sm text-slate-500">

      <p>
        If you have questions about this shipment,
        please contact NKDON Logistics.
      </p>

    </div>

  `;
}


/* =========================================================
   FORMAT DATE
   ========================================================= */

function formatDate(value) {

  if (!value) {
    return "—";
  }

  const date =
    new Date(value);

  if (isNaN(date.getTime())) {
    return value;
  }

  return date.toLocaleDateString(
    undefined,
    {
      year: "numeric",
      month: "long",
      day: "numeric"
    }
  );
}


/* =========================================================
   FORMAT DATE + TIME
   ========================================================= */

function formatDateTime(value) {

  if (!value) {
    return "—";
  }

  const date =
    new Date(value);

  if (isNaN(date.getTime())) {
    return value;
  }

  return date.toLocaleString(
    undefined,
    {
      year: "numeric",
      month: "short",
      day: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    }
  );
}


/* =========================================================
   SECURITY
   ========================================================= */

function escapeHtml(value) {

  if (value === null ||
      value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================================================
   ENTER KEY
   ========================================================= */

document
  .getElementById("trackingInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {
        trackShipment();
      }

    }
  );


/* =========================================================
   AUTOMATIC TEST
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    const input =
      document.getElementById("trackingInput");

    /*
      Remove this automatic test later if you don't
      want a tracking number to appear automatically.
    */

    input.value =
      "NKD-20260924-4034";

  }
);

</script>

</body>
</html>
