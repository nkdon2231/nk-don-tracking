/* =========================================================

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function formatStatus(status) {

  if (!status) {
    return "Processing";
  }

  const names = {

    pickup_scheduled:
      "Pickup Scheduled",

    picked_up:
      "Picked Up",

    processing:
      "Processing",

    in_transit:
      "In Transit",

    arrived:
      "Arrived at Facility",

    arrived_at_facility:
      "Arrived at Facility",

    out_for_delivery:
      "Out for Delivery",

    delivered:
      "Delivered",

    delayed:
      "Delayed",

    cancelled:
      "Cancelled"

  };

  const normalized =
    String(status)
      .toLowerCase()
      .replace(/[\s-]+/g, "_");

  if (names[normalized]) {
    return names[normalized];
  }

  return String(status)
    .replace(/[_-]+/g, " ")
    .replace(/\b\w/g, letter =>
      letter.toUpperCase()
    );

}


function formatDate(value) {

  if (!value) {
    return "—";
  }

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return String(value);
  }

  return date.toLocaleDateString(
    "en-NG",
    {
      day: "2-digit",
      month: "short",
      year: "numeric"
    }
  );

}


function formatDateTime(value) {

  if (!value) {
    return "—";
  }

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return String(value);
  }

  return date.toLocaleString(
    "en-NG",
    {
      day: "2-digit",
      month: "short",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    }
  );

}


/* =========================================================
   STATUS DESIGN
   ========================================================= */

function statusClass(status) {

  const normalized =
    String(status || "")
      .toLowerCase()
      .replace(/[\s-]+/g, "_");


  if (normalized === "delivered") {

    return `
      bg-emerald-500/10
      text-emerald-300
      border-emerald-500/30
    `;

  }


  if (normalized === "out_for_delivery") {

    return `
      bg-blue-500/10
      text-blue-300
      border-blue-500/30
    `;

  }


  if (normalized === "in_transit") {

    return `
      bg-amber-500/10
      text-amber-300
      border-amber-500/30
    `;

  }


  if (
    normalized === "delayed" ||
    normalized === "cancelled"
  ) {

    return `
      bg-red-500/10
      text-red-300
      border-red-500/30
    `;

  }


  return `
    bg-slate-500/10
    text-slate-300
    border-slate-500/30
  `;

}

/* =========================================================
   PUBLIC TRACKING
   ========================================================= */

async function trackShipment() {

  const input =
    document.getElementById(
      "trackingInput"
    );

  const button =
    document.getElementById(
      "trackButton"
    );


  const trackingNumber =
    input.value
      .trim()
      .toUpperCase();


  if (!trackingNumber) {

    showMessage(
      "Please enter your tracking number.",
      "error"
    );

    return;

  }


  button.disabled = true;

  button.textContent =
    "Tracking...";


  document.getElementById(
    "result"
  ).innerHTML = "";


  showMessage(
    "Searching the NKDON shipment network..."
  );


  try {

    /*
      Load Supabase JS only when needed.
    */

    if (
      !window.supabase ||
      !window.supabase.createClient
    ) {

      throw new Error(
        "Supabase library unavailable."
      );

    }


    if (!supabaseClient) {

      supabaseClient =
        window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );

    }


    /*
      Existing NKDON RPC:

      public.track_shipment(text)

      The parameter is expected to be:
      p_tracking_number
    */

    const response =
      await supabaseClient.rpc(
        "track_shipment",
        {
          p_tracking_number:
            trackingNumber
        }
      );


    console.log(
      "NKDON Supabase response:",
      response
    );


    if (response.error) {

      console.error(
        "Supabase RPC error:",
        response.error
      );

      throw response.error;

    }


    const data =
      response.data;


    /*
      Supabase returns one row
      containing the track_shipment
      JSON result.

      Example:

      [
        {
          track_shipment: {
            shipment: {...},
            events: [...]
          }
        }
      ]
    */

    let payload = null;


    if (Array.isArray(data)) {

      if (
        data.length > 0 &&
        data[0] &&
        data[0].track_shipment
      ) {

        payload =
          data[0].track_shipment;

      }

      else if (
        data.length > 0 &&
        data[0] &&
        data[0].shipment
      ) {

        payload =
          data[0];

      }

    }

    else if (
      data &&
      data.track_shipment
    ) {

      payload =
        data.track_shipment;

    }

    else if (
      data &&
      data.shipment
    ) {

      payload =
        data;

    }


    console.log(
      "NKDON tracking payload:",
      payload
    );


    if (
      !payload ||
      !payload.shipment
    ) {

      showNotFound(
        trackingNumber
      );

      showMessage(
        "No shipment was found for this tracking number.",
        "error"
      );

      return;

    }


    renderShipment(
      payload,
      trackingNumber
    );


  }

  catch (error) {

    console.error(
      "NKDON tracking error:",
      error
    );


    document.getElementById(
      "result"
    ).innerHTML = `

      <div class="
        rounded-3xl
        border
        border-red-500/20
        bg-red-500/5
        p-8
        text-center
      ">

        <div class="text-4xl mb-3">
          ⚠️
        </div>


        <h2 class="
          text-xl
          font-bold
        ">

          Tracking Temporarily Unavailable

        </h2>


        <p class="
          mt-2
          text-sm
          text-slate-400
        ">

          Please check the tracking number
          and try again.

        </p>

      </div>

    `;


    showMessage(
      "The tracking service could not retrieve the shipment right now.",
      "error"
    );

  }


  finally {

    button.disabled = false;

    button.textContent =
      "Track Shipment";

  }

}
