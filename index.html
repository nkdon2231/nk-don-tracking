<script>
/* =========================================================
   NKDON LOGISTICS — SUPABASE PUBLIC TRACKING
   ========================================================= */

const SUPABASE_URL = "https://cpjbxllhabghsvpsdzrm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ZmrGlIzkRyR4Kenj9s8HyQ_q-6t8GsW";

const { createClient } = supabase;
const nkdonSupabase = createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* =========================================================
   PUBLIC SHIPMENT TRACKING
   ========================================================= */

async function publicTrack() {
  const input = document.getElementById("public-tracking-input");
  const result = document.getElementById("public-result");
  const button = document.getElementById("public-track-btn");

  if (!input || !result) {
    console.error("NKDON tracking elements were not found.");
    return;
  }

  const trackingNumber = input.value.trim().toUpperCase();

  if (!trackingNumber) {
    result.innerHTML = `
      <div class="rounded-2xl border border-red-500/30 bg-red-500/10 p-5 text-center">
        <div class="text-red-400 text-3xl mb-2">⚠️</div>
        <h3 class="text-white font-bold text-lg">Tracking Number Required</h3>
        <p class="text-slate-400 mt-1">
          Please enter your NKDON tracking number.
        </p>
      </div>
    `;
    return;
  }

  if (button) {
    button.disabled = true;
    button.innerHTML = `
      <span class="inline-flex items-center gap-2">
        <span class="animate-spin">⟳</span>
        Tracking...
      </span>
    `;
  }

  result.innerHTML = `
    <div class="rounded-2xl border border-slate-700 bg-slate-900/60 p-8 text-center">
      <div class="text-4xl mb-3 animate-pulse">📦</div>
      <p class="text-slate-300">Searching NKDON shipment network...</p>
      <p class="text-slate-500 text-sm mt-1">${escapeHtml(trackingNumber)}</p>
    </div>
  `;

  try {
    /*
      Your Supabase function is:

      public.track_shipment(text)

      The JavaScript RPC call below passes the tracking number.
    */

    const { data, error } = await nkdonSupabase.rpc(
      "track_shipment",
      {
        p_tracking_number: trackingNumber
      }
    );

    if (error) {
      console.error("NKDON Supabase tracking error:", error);
      throw error;
    }

    console.log("NKDON tracking response:", data);

    /*
      IMPORTANT:

      Supabase returns the result of the RPC as an array
      containing one row.

      The row contains a column named "track_shipment".

      Therefore we extract:

      data[0].track_shipment
    */

    let payload = null;

    if (Array.isArray(data)) {
      if (data.length > 0) {
        const firstRow = data[0];

        if (firstRow && firstRow.track_shipment) {
          payload = firstRow.track_shipment;
        } else {
          payload = firstRow;
        }
      }
    } else if (data && data.track_shipment) {
      payload = data.track_shipment;
    } else {
      payload = data;
    }

    console.log("NKDON tracking payload:", payload);

    if (
      !payload ||
      !payload.shipment
    ) {
      showTrackingUnavailable(result, trackingNumber);
      return;
    }

    const shipment = payload.shipment;
    const events = Array.isArray(payload.events)
      ? payload.events
      : [];

    renderShipment(result, shipment, events);

  } catch (error) {
    console.error("NKDON public tracking failed:", error);

    result.innerHTML = `
      <div class="rounded-2xl border border-red-500/30 bg-red-500/10 p-6">
        <div class="flex items-start gap-4">
          <div class="text-3xl">⚠️</div>
          <div>
            <h3 class="text-white font-bold text-lg">
              Tracking Temporarily Unavailable
            </h3>
            <p class="text-slate-400 mt-1">
              We could not retrieve this shipment at the moment.
              Please check the tracking number and try again.
            </p>
          </div>
        </div>
      </div>
    `;
  } finally {
    if (button) {
      button.disabled = false;
      button.innerHTML = "Track Shipment";
    }
  }
}


/* =========================================================
   RENDER SHIPMENT
   ========================================================= */

function renderShipment(container, shipment, events) {

  const status = normalizeStatus(
    shipment.status || "Processing"
  );

  const statusLabel = formatStatus(status);

  const statusClass = getStatusClass(status);

  const trackingNumber =
    shipment.tracking_number ||
    "N/A";

  const origin =
    shipment.origin ||
    "Not available";

  const destination =
    shipment.destination ||
    "Not available";

  const currentLocation =
    shipment.current_location ||
    events[0]?.location ||
    destination ||
    "In transit";

  const estimatedDelivery =
    formatDate(
      shipment.estimated_delivery
    );

  const createdDate =
    formatDate(
      shipment.created_at
    );

  const pickupDate =
    formatDate(
      shipment.pickup_date
    );

  const actualDeliveryDate =
    formatDate(
      shipment.actual_delivery_date
    );

  const shippingMethod =
    shipment.shipping_method ||
    "Standard Delivery";

  const packageDescription =
    shipment.package_description ||
    "Shipment";

  const weight =
    shipment.package_weight ||
    "Not specified";

  const referenceNumber =
    shipment.reference_number ||
    "Not available";

  const quantity =
    shipment.quantity ||
    "1";

  const shipmentType =
    shipment.shipment_type ||
    "Parcel";


  container.innerHTML = `
    <div class="space-y-6">

      <!-- STATUS HEADER -->
      <div class="rounded-3xl border border-slate-700
                  bg-slate-900/80 overflow-hidden shadow-2xl">

        <div class="p-6 md:p-8">

          <div class="flex flex-col md:flex-row
                      md:items-center md:justify-between gap-5">

            <div>
              <p class="text-xs uppercase tracking-[0.25em]
                        text-slate-500 mb-2">
                NKDON SHIPMENT
              </p>

              <h2 class="text-2xl md:text-3xl
                         font-bold text-white break-all">
                ${escapeHtml(trackingNumber)}
              </h2>

              <p class="text-slate-400 mt-2">
                Reference:
                <span class="text-slate-300">
                  ${escapeHtml(referenceNumber)}
                </span>
              </p>
            </div>

            <div class="${statusClass}
                        px-5 py-3 rounded-2xl
                        font-bold text-center">
              ${escapeHtml(statusLabel)}
            </div>

          </div>

        </div>

        <!-- ROUTE -->
        <div class="border-t border-slate-800
                    p-6 md:p-8">

          <div class="grid md:grid-cols-3
                      gap-6 items-center">

            <div>
              <p class="text-xs uppercase
                        tracking-wider text-slate-500">
                Origin
              </p>

              <p class="text-white font-semibold mt-1">
                ${escapeHtml(origin)}
              </p>
            </div>

            <div class="hidden md:flex
                        items-center justify-center">

              <div class="w-full flex items-center">

                <div class="h-px bg-slate-700 flex-1"></div>

                <div class="mx-3 w-10 h-10
                            rounded-full
                            border border-slate-600
                            bg-slate-800
                            flex items-center
                            justify-center">
                  🚚
                </div>

                <div class="h-px bg-slate-700 flex-1"></div>

              </div>

            </div>

            <div class="md:text-right">
              <p class="text-xs uppercase
                        tracking-wider text-slate-500">
                Destination
              </p>

              <p class="text-white font-semibold mt-1">
                ${escapeHtml(destination)}
              </p>
            </div>

          </div>

        </div>

      </div>


      <!-- SHIPMENT DETAILS -->
      <div class="grid md:grid-cols-2 gap-5">

        <div class="rounded-2xl border border-slate-700
                    bg-slate-900/70 p-6">

          <h3 class="text-white font-bold text-lg mb-5">
            Shipment Details
          </h3>

          <div class="space-y-4">

            ${detailRow(
              "Current Location",
              currentLocation
            )}

            ${detailRow(
              "Shipment Type",
              shipmentType
            )}

            ${detailRow(
              "Package",
              packageDescription
            )}

            ${detailRow(
              "Quantity",
              quantity
            )}

            ${detailRow(
              "Weight",
              weight
            )}

            ${detailRow(
              "Shipping Method",
              shippingMethod
            )}

          </div>

        </div>


        <div class="rounded-2xl border border-slate-700
                    bg-slate-900/70 p-6">

          <h3 class="text-white font-bold text-lg mb-5">
            Delivery Information
          </h3>

          <div class="space-y-4">

            ${detailRow(
              "Estimated Delivery",
              estimatedDelivery
            )}

            ${detailRow(
              "Pickup Date",
              pickupDate
            )}

            ${detailRow(
              "Shipment Created",
              createdDate
            )}

            ${
              actualDeliveryDate !== "—"
              ? detailRow(
                  "Delivered",
                  actualDeliveryDate
                )
              : ""
            }

          </div>

        </div>

      </div>


      <!-- TRACKING TIMELINE -->
      <div class="rounded-2xl border border-slate-700
                  bg-slate-900/70 p-6 md:p-8">

        <div class="flex items-center
                    justify-between mb-7">

          <div>
            <p class="text-xs uppercase
                      tracking-[0.2em] text-slate-500">
              Shipment History
            </p>

            <h3 class="text-white
                       text-xl font-bold mt-1">
              Tracking Updates
            </h3>
          </div>

          <div class="text-2xl">
            📍
          </div>

        </div>

        ${
          events.length
            ? renderTimeline(events)
            : `
              <div class="text-slate-500
                          text-center py-8">
                No tracking events available yet.
              </div>
            `
        }

      </div>


      <!-- SUPPORT -->
      <div class="rounded-2xl border border-slate-700
                  bg-slate-900/60 p-6 text-center">

        <p class="text-slate-400 text-sm">
          Need help with this shipment?
        </p>

        <p class="text-white font-semibold mt-1">
          Contact NKDON Logistics Support
        </p>

      </div>

    </div>
  `;
}


/* =========================================================
   TIMELINE
   ========================================================= */

function renderTimeline(events) {

  const sortedEvents = [...events].sort(
    (a, b) => {
      const dateA =
        new Date(
          a.event_time ||
          a.created_at ||
          0
        ).getTime();

      const dateB =
        new Date(
          b.event_time ||
          b.created_at ||
          0
        ).getTime();

      return dateB - dateA;
    }
  );

  return `
    <div class="relative">

      <div class="absolute left-[15px]
                  top-3 bottom-3
                  w-px bg-slate-700">
      </div>

      <div class="space-y-7">

        ${sortedEvents.map((event, index) => {

          const eventStatus =
            event.status ||
            "Update";

          const eventLocation =
            event.location ||
            event.facility ||
            "";

          const eventDescription =
            event.description ||
            "";

          const eventCode =
            event.event_code ||
            "";

          const eventDate =
            formatDateTime(
              event.event_time ||
              event.created_at
            );

          const isLatest = index === 0;

          return `
            <div class="relative flex gap-5">

              <div class="relative z-10
                          w-8 h-8 shrink-0
                          rounded-full
                          ${
                            isLatest
                              ? "bg-amber-500 text-slate-950"
                              : "bg-slate-800 text-slate-300"
                          }
                          border
                          ${
                            isLatest
                              ? "border-amber-400"
                              : "border-slate-600"
                          }
                          flex items-center
                          justify-center
                          text-sm">

                ${isLatest ? "✓" : "•"}

              </div>

              <div class="flex-1
                          pb-1">

                <div class="flex flex-col
                            md:flex-row
                            md:items-center
                            md:justify-between gap-1">

                  <h4 class="font-bold
                             ${
                               isLatest
                                 ? "text-white"
                                 : "text-slate-300"
                             }">

                    ${escapeHtml(
                      formatStatus(eventStatus)
                    )}

                  </h4>

                  <span class="text-xs
                               text-slate-500">

                    ${escapeHtml(eventDate)}

                  </span>

                </div>

                ${
                  eventLocation
                    ? `
                      <p class="text-sm
                                text-slate-400
                                mt-1">

                        📍 ${escapeHtml(
                          eventLocation
                        )}

                      </p>
                    `
                    : ""
                }

                ${
                  eventDescription
                    ? `
                      <p class="text-sm
                                text-slate-400
                                mt-2 leading-relaxed">

                        ${escapeHtml(
                          eventDescription
                        )}

                      </p>
                    `
                    : ""
                }

                ${
                  eventCode
                    ? `
                      <p class="text-[10px]
                                uppercase
                                tracking-wider
                                text-slate-600
                                mt-2">

                        ${escapeHtml(eventCode)}

                      </p>
                    `
                    : ""
                }

              </div>

            </div>
          `;
        }).join("")}

      </div>

    </div>
  `;
}


/* =========================================================
   DETAIL ROW
   ========================================================= */

function detailRow(label, value) {

  return `
    <div class="flex items-start
                justify-between gap-4
                border-b border-slate-800
                pb-3 last:border-0 last:pb-0">

      <span class="text-sm text-slate-500">
        ${escapeHtml(label)}
      </span>

      <span class="text-sm text-slate-200
                   font-medium text-right">
        ${escapeHtml(value || "—")}
      </span>

    </div>
  `;
}


/* =========================================================
   UNAVAILABLE
   ========================================================= */

function showTrackingUnavailable(
  container,
  trackingNumber
) {

  container.innerHTML = `
    <div class="rounded-3xl
                border border-slate-700
                bg-slate-900/80
                p-8 md:p-10 text-center">

      <div class="text-5xl mb-4">
        📦
      </div>

      <h3 class="text-white
                 text-xl md:text-2xl
                 font-bold">

        Shipment Not Found

      </h3>

      <p class="text-slate-400
                mt-2 max-w-md mx-auto">

        We could not find a shipment associated
        with tracking number

        <span class="text-white font-semibold">
          ${escapeHtml(trackingNumber)}
        </span>.

      </p>

      <p class="text-slate-500 text-sm mt-4">
        Please check the tracking number and try again.
      </p>

    </div>
  `;
}


/* =========================================================
   STATUS HELPERS
   ========================================================= */

function normalizeStatus(status) {

  return String(status || "")
    .trim()
    .toLowerCase()
    .replace(/[\s-]+/g, "_");
}


function formatStatus(status) {

  const value =
    normalizeStatus(status);

  const names = {
    pickup_scheduled: "Pickup Scheduled",
    picked_up: "Picked Up",
    processing: "Processing",
    in_transit: "In Transit",
    arrived: "Arrived at Facility",
    arrived_at_facility: "Arrived at Facility",
    out_for_delivery: "Out for Delivery",
    delivered: "Delivered",
    cancelled: "Cancelled",
    delayed: "Delayed"
  };

  if (names[value]) {
    return names[value];
  }

  return String(status || "Processing")
    .replace(/[_-]+/g, " ")
    .replace(/\b\w/g, char =>
      char.toUpperCase()
    );
}


function getStatusClass(status) {

  const value =
    normalizeStatus(status);

  if (value === "delivered") {
    return "bg-green-500/15 text-green-400 border border-green-500/30";
  }

  if (value === "out_for_delivery") {
    return "bg-blue-500/15 text-blue-400 border border-blue-500/30";
  }

  if (value === "in_transit") {
    return "bg-amber-500/15 text-amber-400 border border-amber-500/30";
  }

  if (value === "delayed") {
    return "bg-red-500/15 text-red-400 border border-red-500/30";
  }

  if (value === "cancelled") {
    return "bg-red-500/15 text-red-400 border border-red-500/30";
  }

  return "bg-slate-700/60 text-slate-200 border border-slate-600";
}


/* =========================================================
   DATE HELPERS
   ========================================================= */

function formatDate(value) {

  if (!value) {
    return "—";
  }

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return String(value);
  }

  return date.toLocaleDateString(
    "en-NG",
    {
      year: "numeric",
      month: "short",
      day: "numeric"
    }
  );
}


function formatDateTime(value) {

  if (!value) {
    return "—";
  }

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return String(value);
  }

  return date.toLocaleString(
    "en-NG",
    {
      year: "numeric",
      month: "short",
      day: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    }
  );
}


/* =========================================================
   SECURITY / HTML ESCAPING
   ========================================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================================================
   AUTO-TRACK FROM URL
   Example:

   https://nkdon2231.github.io/nk-don-tracking/
   ?tracking=NKD-20260924-4034
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    const input =
      document.getElementById(
        "public-tracking-input"
      );

    if (!input) {
      return;
    }

    const params =
      new URLSearchParams(
        window.location.search
      );

    const tracking =
      params.get("tracking") ||
      params.get("track") ||
      params.get("tracking_number");

    if (tracking) {

      input.value =
        tracking.toUpperCase();

      setTimeout(
        () => publicTrack(),
        300
      );
    }

  }
);


/* =========================================================
   ENTER KEY SUPPORT
   ========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      document.activeElement?.id ===
        "public-tracking-input"
    ) {

      event.preventDefault();

      publicTrack();
    }

  }
);

</script>
